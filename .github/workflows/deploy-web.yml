name: Deploy router page

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # ключ можно хранить и в base64 одной строкой, и целиком (-----BEGIN …)
          case "$SSH_KEY" in
            *"-----BEGIN"*) printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy ;;
            *) echo "$SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy ;;
          esac
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync web/ -> /var/www/fspirat.online/router/
        run: |
          rsync -avz --delete --exclude 'setup/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./web/ "deploy@${{ secrets.SSH_HOST }}:/var/www/fspirat.online/router/"
