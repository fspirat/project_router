name: Deploy router page

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # ключ можно хранить и в base64 одной строкой, и целиком (-----BEGIN …)
          case "$SSH_KEY" in
            *"-----BEGIN"*) printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy ;;
            *) echo "$SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy ;;
          esac
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync web/ -> /var/www/fspirat.online/router/
        run: |
          # Ключ deploy ограничен rrsync (только выкладка в /var/www/fspirat.online, пути — от этой папки).
          # Пока ограничения нет — полный путь (так workflow работает и до, и после включения rrsync).
          H="deploy@${{ secrets.SSH_HOST }}"
          if [ "$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes $H echo plain 2>/dev/null)" = plain ]; then D=/var/www/fspirat.online/router/; else D=router/; fi
          echo "цель: $D"
          # повтор: rrsync не пускает две выкладки одновременно (сайт и страница роутера в одну секунду)
          for i in 1 2 3; do
            rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy" ./web/ "$H:$D" && break
            [ $i = 3 ] && exit 1; echo "повтор через 20 с"; sleep 20
          done
