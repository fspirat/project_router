name: Deploy router page

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync web/ -> /var/www/fspirat.online/router/
        run: |
          rsync -avz --delete --exclude 'setup/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./web/ "deploy@${{ secrets.SSH_HOST }}:/var/www/fspirat.online/router/"
