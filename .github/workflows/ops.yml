name: Server ops

# Служебный сценарий для Claude: выполнить команду на VPS (root) и показать вывод в логе.
# Запуск: Actions → Server ops → Run workflow, или через API (workflow_dispatch).
# Репозиторий приватный — логи видит только владелец. Секреты в логах скрыты (***).
#   OPS_SSH_KEY — закрытый ключ root (base64 одной строкой)
#   SSH_KEY     — закрытый ключ пользователя deploy (base64) — для выкладки web/
#   SSH_HOST    — адрес сервера
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Команда для выполнения на сервере (root). Пусто — только проверка ключей."
        required: false
        default: ""

concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          OPS_SSH_KEY: ${{ secrets.OPS_SSH_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ok=1
          for n in OPS_SSH_KEY SSH_KEY SSH_HOST; do
            if [ -z "${!n}" ]; then echo "❌ секрет $n не задан"; ok=0; else echo "✅ секрет $n задан"; fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for n in OPS_SSH_KEY SSH_KEY; do
            [ -n "${!n}" ] || continue
            f=~/.ssh/$n
            v="${!n}"
            case "$v" in
              ssh-ed25519*|ssh-rsa*|ecdsa-*) echo "❌ $n — это ОТКРЫТЫЙ ключ (.pub), нужен закрытый"; ok=0; continue ;;
              *"-----BEGIN"*) printf '%s\n' "$v" > "$f"; kind="как есть" ;;   # вставлен целиком
              *) echo "$v" | tr -d ' \r\n' | base64 -d > "$f" 2>/dev/null || true; kind="base64" ;;
            esac
            chmod 600 "$f"
            if ssh-keygen -y -f "$f" >/dev/null 2>&1; then
              echo "✅ $n — правильный закрытый ключ, формат: $kind ($(ssh-keygen -l -f "$f" | awk '{print $1, $4}'))"
            else
              echo "❌ $n — не удалось прочитать закрытый ключ (формат: $kind)"; rm -f "$f"
              [ "$n" = OPS_SSH_KEY ] && ok=0
            fi
          done
          [ $ok = 1 ]
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test logins
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/OPS_SSH_KEY root@"$SSH_HOST" 'echo "✅ вход root: $(whoami)@$(hostname)"'
          [ -f ~/.ssh/SSH_KEY ] || { echo "⚠️ вход deploy не проверен: SSH_KEY не читается"; exit 0; }
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/SSH_KEY deploy@"$SSH_HOST" 'echo "✅ вход deploy: $(whoami)@$(hostname); запись в /var/www/fspirat.online/router: $(test -w /var/www/fspirat.online/router && echo да || echo нет)"'

      - name: Run command
        if: inputs.cmd != ''
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          CMD: ${{ inputs.cmd }}
        run: |
          echo "▶ $CMD"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/OPS_SSH_KEY root@"$SSH_HOST" "$CMD"
