name: Deploy router

# Выкладка скриптов на роутер через сервер: VPS → обратный туннель (127.0.0.1:8022 → dropbear роутера).
# Ключ сервера /root/.ssh/router_key добавлен в /etc/dropbear/authorized_keys роутера.
# PassWall и туннель не перезапускает; cron fspirat-ping добавляет, если его нет.
on:
  workflow_dispatch:

concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checks
        run: |
          for f in router/bin/fspirat-ping router/bin/fspirat-targets router/bin/fspirat-svcping router/bin/fspirat-fw router/bin/fspirat-sub router/bin/fspirat-zapret router/bin/fspirat-tgws router/bin/fspirat-led router/www/cgi-bin/fspirat router/etc/init.d/fstunnel router/etc/init.d/fspirat-zapret router/etc/init.d/fspirat-tgws; do sh -n "$f"; done
          if command -v luac >/dev/null; then luac -p router/bin/fspirat-subs; fi

      - name: SSH
        env:
          OPS_SSH_KEY: ${{ secrets.OPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$OPS_SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/ops && chmod 600 ~/.ssh/ops
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host vps\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/ops\n  BatchMode yes\n' "$SSH_HOST" > ~/.ssh/config

      - name: Upload to router
        run: |
          R='ssh -p 8022 -i /root/.ssh/router_key -o BatchMode=yes -o ConnectTimeout=10 root@127.0.0.1'
          ssh vps "$R 'cat /tmp/sysinfo/model; uptime'"
          push() { # файл_в_репозитории путь_на_роутере
            tr -d '\r' < "$1" | ssh vps "$R 'cat > $2.new && chmod 755 $2.new && mv $2.new $2'"
            echo "  -> $2"
          }
          # свой список сервисов для замера, если его ещё нет: сохранить тот, что сейчас по умолчанию
          # (список по умолчанию в fspirat-targets меняется — у работающей установки он остаётся прежним)
          ssh vps "$R '[ -s /etc/fspirat/targets ] || { [ -s /tmp/fspirat/targets.default ] && mkdir -p /etc/fspirat && cp /tmp/fspirat/targets.default /etc/fspirat/targets && echo \"  список сервисов сохранён в /etc/fspirat/targets\"; }; true'"
          # fspirat-subs — первым: CGI и fspirat-ping берут из него список подписок (без него панель видит только свои серверы)
          push router/bin/fspirat-subs    /usr/bin/fspirat-subs
          push router/bin/fspirat-ping    /usr/bin/fspirat-ping
          push router/www/cgi-bin/fspirat /www/cgi-bin/fspirat
          # Туннель: адрес сервера — TUNNEL_HOST в /etc/fspirat/config (в репозитории его нет). Первый раз он берётся из
          # установленного fstunnel; новый файл ставится, только если даёт ту же команду, что работает сейчас (туннель не перезапускается)
          tr -d '\r' < router/etc/init.d/fstunnel | ssh vps "$R 'cat > /tmp/fstunnel.new'"
          ssh vps "$R 'sh -s'" <<'SH'
          cmdline() { if grep -q '^tunnel_args()' "$1"; then sed -n '/^tunnel_args()/,/^}/p' "$1" > /tmp/ta.sh; ( . /tmp/ta.sh; tunnel_args ); rm -f /tmp/ta.sh
            else sed -n 's/^ *procd_set_param command //p' "$1" | head -1; fi; }
          old=$(cmdline /etc/init.d/fstunnel)
          mkdir -p /etc/fspirat
          if ! grep -q '^TUNNEL_HOST=' /etc/fspirat/config 2>/dev/null; then
            h=$(echo "$old" | sed -n 's/.*tunnel@\([A-Za-z0-9.:-]*\).*/\1/p')
            [ -n "$h" ] && echo "TUNNEL_HOST=$h" >> /etc/fspirat/config && echo "  адрес туннеля сохранён в /etc/fspirat/config"
          fi
          new=$(cmdline /tmp/fstunnel.new)
          if [ -n "$new" ] && [ "$new" = "$old" ]; then chmod 755 /tmp/fstunnel.new && mv /tmp/fstunnel.new /etc/init.d/fstunnel && echo "  -> /etc/init.d/fstunnel (команда туннеля та же)"
          else rm -f /tmp/fstunnel.new; echo "  ⚠️ fstunnel НЕ обновлён: новая команда туннеля отличается от текущей — проверь /etc/fspirat/config"; fi
          SH
          push router/bin/fspirat-mcping  /usr/bin/fspirat-mcping
          push router/bin/fspirat-targets /usr/bin/fspirat-targets
          push router/bin/fspirat-svcping /usr/bin/fspirat-svcping
          push router/bin/fspirat-fw      /usr/bin/fspirat-fw
          push router/bin/fspirat-sub     /usr/bin/fspirat-sub
          push router/bin/fspirat-led     /usr/bin/fspirat-led
          # zapret: скрипт, служба и списки; сам движок (nfqws) ставит workflow «Zapret install». Режим не включается.
          if ssh vps "$R '[ -d /usr/share/fspirat-tgws ]'"; then   # Telegram через tg-ws-proxy (если установлен)
            push router/bin/fspirat-tgws        /usr/bin/fspirat-tgws
            push router/etc/init.d/fspirat-tgws /etc/init.d/fspirat-tgws
          fi
          if ssh vps "$R '[ -d /usr/share/fspirat-zapret ]'"; then
            push router/bin/fspirat-zapret        /usr/bin/fspirat-zapret
            push router/etc/init.d/fspirat-zapret /etc/init.d/fspirat-zapret
            for l in youtube discord; do tr -d '\r' < router/zapret/$l.txt | ssh vps "$R 'cat > /usr/share/fspirat-zapret/lists/$l.txt.new && mv /usr/share/fspirat-zapret/lists/$l.txt.new /usr/share/fspirat-zapret/lists/$l.txt'"; done
            echo "  -> списки zapret (nfqws перечитает сам; правило PassWall обновит сторож, если режим включён)"
          fi
          ssh vps "$R 'rm -f /usr/bin/fspirat-wake /usr/bin/fspirat-pc /etc/fspirat/pc.mac /etc/fspirat/pc.token'"   # «Разбудить/Усыпить» убраны
          ssh vps "$R '/usr/bin/fspirat-fw && nft list table inet fspirat >/dev/null && echo \"  таблица inet fspirat на месте\"'"
          ssh vps "$R 'grep -q fspirat-ping /etc/crontabs/root || { echo \"*/5 * * * * /usr/bin/fspirat-ping\" >> /etc/crontabs/root; /etc/init.d/cron restart; }'"
          # расписание интернета устройствам — раз в минуту; cron без записи «cron.err» о каждом запуске (это не ошибки)
          ssh vps "$R 'c=0; grep -q \"fspirat-fw schedule\" /etc/crontabs/root || { echo \"* * * * * /usr/bin/fspirat-fw schedule\" >> /etc/crontabs/root; c=1; }
            [ \"\$(uci -q get system.@system[0].cronloglevel)\" = 9 ] || { uci set system.@system[0].cronloglevel=9; uci commit system; c=1; }
            [ \$c = 1 ] && /etc/init.d/cron restart; crontab -l'"

      - name: Verify
        run: |
          ssh vps 'C=$(grep -o "fspirat_token=[A-Za-z0-9]*" /etc/nginx/snippets/fspirat-router.conf)
            curl -s -m 20 -b "$C" "http://127.0.0.1:8081/cgi-bin/fspirat?action=status" | jq -c "{running, current, devices: [.devices[] | {name, band, signal, rate}]}"'
