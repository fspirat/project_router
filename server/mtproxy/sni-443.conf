# /etc/nginx/stream.d/sni-443.conf — порт 443 делится по имени сайта (SNI) без расшифровки:
#   tg.fspirat.online → MTProto-прокси mtg (127.0.0.1:10444), всё остальное → сайты nginx (127.0.0.1:10443).
# proxy_protocol передаёт дальше настоящий IP клиента (сайты берут его через realip-proxy-protocol.conf).
stream {
    map $ssl_preread_server_name $fsr_443_backend {
        tg.fspirat.online  127.0.0.1:10444;
        default            127.0.0.1:10443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $fsr_443_backend;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }
}
