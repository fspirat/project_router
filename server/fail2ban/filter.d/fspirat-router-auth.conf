# /etc/fail2ban/filter.d/fspirat-router-auth.conf
# Строки журнала /var/log/fspirat-router-auth.log: "2026-10-06 20:30:14 FAIL ip=203.0.113.7 ua=..."
# Считаются: FAIL (неверный пароль — страница входа и приложение iPhone) и LOCKED (попытка, когда вход уже закрыт).
# fail2ban сам вырезает из строки дату до сравнения (остаётся " FAIL ip=…"), поэтому дата в начале — необязательная.
# Прежнее «^\S+ \S+ (FAIL|LOCKED)» после вырезания даты не совпадало ни с чем — jail молча не банил (исправлено 13.10.2026).
# Проверка на сервере: fail2ban-regex /var/log/fspirat-router-auth.log /etc/fail2ban/filter.d/fspirat-router-auth.conf
[Definition]
failregex = ^(?:\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)?\s*(?:FAIL|LOCKED) ip=<HOST>
ignoreregex =
