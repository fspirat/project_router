# /etc/fail2ban/filter.d/fspirat-router-app.conf — приложение iPhone (/router/app/v1, server/auth/app.php)
# Строки журнала /var/log/fspirat-router-auth.log: "2026-10-13 20:30:14 APP_BADTOKEN ip=203.0.113.7 ua=..."
# Считаются: APP_BADTOKEN (неверный токен), APP_DENIED (неверное число / «Это не я»), APP_URLTOKEN (токен в адресе).
# Не считаются: APP_LOGIN, APP_OK, APP_REVOKE; FAIL и LOCKED — это jail fspirat-router-auth.
# fail2ban сам вырезает из строки дату до сравнения (остаётся " APP_… ip=…"), поэтому дата в начале — необязательная:
# то же выражение подходит и к целой строке журнала (тесты, grep). Проверка на сервере:
#   fail2ban-regex /var/log/fspirat-router-auth.log /etc/fail2ban/filter.d/fspirat-router-app.conf
[Definition]
failregex = ^(?:\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)?\s*APP_(?:BADTOKEN|DENIED|URLTOKEN) ip=<HOST>
ignoreregex =
