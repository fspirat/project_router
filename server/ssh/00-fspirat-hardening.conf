# /etc/ssh/sshd_config.d/00-fspirat-hardening.conf — вход только по ключам (за 3 дня было 5000+ попыток подобрать пароль).
# Файл с «00-» читается первым, а в sshd побеждает первое значение — cloud-init и прочие его не перебьют.
# Аварийный вход, если ключа под рукой нет: веб-консоль VNC в панели Aeza.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
X11Forwarding no
MaxAuthTries 3
