# /etc/ssh/sshd_config.d/50-tunnel.conf — пользователь туннеля роутера (fstunnel): только обратный проброс
# на 127.0.0.1:8081 (LuCI/CGI) и 127.0.0.1:8022 (SSH роутера). Без локального проброса (-L / direct-tcpip):
# иначе ключ с роутера открывал бы внутренние службы сервера (127.0.0.1:22, mtg, xray) и любые адреса снаружи.
# Применить: sshd -t && systemctl reload ssh (текущий туннель не рвётся, новое правило — с его переподключения).
Match User tunnel
    AllowTcpForwarding remote
    PermitOpen none
    PermitListen 127.0.0.1:8081 127.0.0.1:8022
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
