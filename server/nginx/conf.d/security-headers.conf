# /etc/nginx/conf.d/security-headers.conf — для всех сайтов сервера.
# HSTS: браузер больше не пробует http:// (защита от подмены в открытых Wi-Fi). Без includeSubDomains — на всякий случай.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
