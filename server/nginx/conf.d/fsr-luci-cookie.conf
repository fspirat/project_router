# /etc/nginx/conf.d/fsr-luci-cookie.conf — router.fspirat.online проксирует LuCI роутера через туннель.
# Cookie входа в панель (fsr_session) роутеру не нужна: вырезаем её, чтобы токен сессии не уходил на роутер.
map $http_cookie $fsr_luci_cookie {
    "~^(?<fsr_a>.*?)\s*fsr_session=[^;]*;?\s*(?<fsr_b>.*)$"  "$fsr_a$fsr_b";
    default  $http_cookie;
}
