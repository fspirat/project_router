# /etc/nginx/conf.d/fsr-limits.conf — ограничение частоты запросов к API панели роутера (snippets/fspirat-router.conf).
# Страница сама опрашивает ~1 раз в 3 с (скорость) и 30 с (статус); 5 запросов/с с пачкой 30 — с большим запасом,
# а перебор/зацикленный скрипт получит 429 и не нагрузит роутер.
limit_req_zone $binary_remote_addr zone=fsr_api:1m rate=5r/s;
limit_req_status 429;

# Приложение iPhone (/router/app/v1/ → server/auth/app.php, блок fsr-app в сниппете ставит nginx-apply.py) — свои зоны,
# отдельно от веба. По IP: 5 запросов/с (пачка 40 — в локации). По устройству: 2 запроса/с (пачка 20); ключ — первые
# 12 символов токена после «fsr1_» (72 бита: устройства не путаются, а целиком токен в память nginx не попадает).
# Без токена ключ пустой — такие запросы зона устройства не считает (их держит зона по IP).
# «Bearer» — с учётом регистра (~, не ~*), и app.php принимает только так: «bearer fsr1_…» с пустым ключом обходил бы
# зону устройства, поэтому PHP такой заголовок отвергает (401 token_invalid).
limit_req_zone $binary_remote_addr zone=fsr_app_ip:1m rate=5r/s;
map $http_authorization $fsr_app_key {
    "~^Bearer fsr1_(?<fsr_k>[A-Za-z0-9_-]{12})"  $fsr_k;
    default "";
}
limit_req_zone $fsr_app_key zone=fsr_app_dev:1m rate=2r/s;
