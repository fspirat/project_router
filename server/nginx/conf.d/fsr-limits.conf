# /etc/nginx/conf.d/fsr-limits.conf — ограничение частоты запросов к API панели роутера (snippets/fspirat-router.conf).
# Страница сама опрашивает ~1 раз в 3 с (скорость) и 30 с (статус); 5 запросов/с с пачкой 30 — с большим запасом,
# а перебор/зацикленный скрипт получит 429 и не нагрузит роутер.
limit_req_zone $binary_remote_addr zone=fsr_api:1m rate=5r/s;
limit_req_status 429;
