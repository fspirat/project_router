# Настройки установки панели. Своя установка: поменяйте значения ниже — или положите такой же файл на сервер
# в /etc/fspirat-router/deploy.conf (он главнее этого: так свои адреса не попадают в репозиторий).
# Здесь только открытые имена — секреты (ключи SSH, адрес сервера, токен бота) лежат в секретах репозитория и на сервере.
PANEL_DOMAIN=example.org          # сайт панели: https://PANEL_DOMAIN/router/ (на этот домен ставится cookie входа)
LUCI_DOMAIN=luci.example.org      # LuCI через сервер — кнопка «LuCI» в шапке; поддомен PANEL_DOMAIN — тогда вход общий
TG_BOT=YourRouterBot              # имя бота уведомлений (без @), упоминается в подсказках
