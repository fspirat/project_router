# XcodeGen: из этого файла собирается ios/Router.xcodeproj (сам проект и Router/Info.plist в git не хранятся).
#   brew install xcodegen && xcodegen generate --spec ios/project.yml
# Сборка в TestFlight — .github/workflows/ios-testflight.yml (он передаёт DEVELOPMENT_TEAM,
# CURRENT_PROJECT_VERSION и FSR_BUILD_DATE).
name: Router

options:
  bundleIdPrefix: xyz.fspirat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

packages:
  RouterCore:
    path: RouterCore

targets:
  Router:
    type: application
    platform: iOS
    sources:
      - path: Router
    dependencies:
      - package: RouterCore
    info:
      path: Router/Info.plist
      properties:
        CFBundleDisplayName: Роутер
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations:
          - ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Face ID защищает доступ к роутеру и опасные действия.
        FSRBaseURL: $(FSR_BASE_URL)
        FSRBuildDate: $(FSR_BUILD_DATE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.fspirat.router
        PRODUCT_NAME: Router
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        # не секрет: адрес API приложения (только https)
        FSR_BASE_URL: "https://fspirat.xyz/router/app/v1/"
        # дату сборки (ГГГГ-ММ-ДД) передаёт CI; по ней приложение считает срок сборки TestFlight (90 дней)
        FSR_BUILD_DATE: ""

schemes:
  Router:
    build:
      targets:
        Router: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
